name: Build OpenFlux for iOS Terminal (WASM) 

on:
workflow_dispatch: 

jobs:
build-wasm:
runs-on: ubuntu-latest 

steps:

* name: Checkout repository
uses: actions/checkout@v4
* name: Set up Go
uses: actions/setup-go@v5
with:
go-version: '1.21'
* name: Install dependencies
run: go mod tidy
* name: Compile to WebAssembly
run: |

# Компилируем под целевую архитектуру WebAssembly / Javascript

GOOS=js GOARCH=wasm go build -o openflux.wasm main.go

* name: Get WASM Executable Helper
run: | 

cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" ./
* name: Upload Artifacts
uses: actions/upload-artifact@v4
with:
name: openflux-wasm-files
path: |
openflux.wasm