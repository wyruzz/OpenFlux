name: Build OpenFlux for iOS Terminal (WASM) 

on:
workflow_dispatch: 

jobs:
build-wasm:
runs-on: ubuntu-latest 

steps:

* name: Checkout repository
uses: actions/checkout@v4
* name: Set up Go
uses: actions/setup-go@v5
with:
go-version: 'stable' # Автоматически выберет самую стабильную и свежую версию
* name: Install dependencies
run: |
go mod tidy
* name: Compile to WebAssembly
run: |

# Включаем принудительный запуск сборки, игнорируя некоторые сетевые ограничения платформ

export CGO_ENABLED=0
GOOS=js GOARCH=wasm go build -o openflux.wasm main.go

* name: Upload Artifacts
uses: actions/upload-artifact@v4
with:
name: openflux-wasm-file
path: openflux.wasm