name: Build OpenFlux for iOS Terminal (Binary) 

on:
workflow_dispatch: 

jobs:
build-ios-bin:
runs-on: macos-latest # Используем Мак в облаке, чтобы был доступен iOS SDK 

steps:

* name: Checkout repository
uses: actions/checkout@v4
* name: Set up Go
uses: actions/setup-go@v5
with:
go-version: 'stable'
* name: Install dependencies
run: go mod tidy
* name: Compile Native iOS Binary
run: |

### Компилируем чистый бинарник под архитектуру процессоров iPhone (arm64)

# Отключаем CGO для статической линковки

export CGO_ENABLED=0
export GOOS=ios
export GOARCH=arm64
go build -o openflux-ios-cli main.go

* name: Upload Native Binary
uses: actions/upload-artifact@v4
with:
name: openflux-ios-binary
path: openflux-ios-cli