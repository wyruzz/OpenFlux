name: Build OpenFlux for iOS Terminal (Binary) 

on:
workflow_dispatch: 

jobs:
build-ios-bin:
runs-on: macos-latest 

steps:

* name: Checkout repository
uses: actions/checkout@v4
* name: Set up Go
uses: actions/setup-go@v5
with:
go-version: 'stable'
* name: Install dependencies
run: go mod tidy
* name: Compile Native iOS Binary with CGO
run: |

### Находим пути к iOS SDK и компилятору Clang

SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
CLANG_PATH=$(xcrun --sdk iphoneos --find clang) 

### Настраиваем переменные окружения Go

export CGO_ENABLED=1
export GOOS=ios
export GOARCH=arm64 

### Передаем параметры компилятора Apple

export CGO_CFLAGS="-isysroot $SDK_PATH -miphoneos-version-min=14.0"
export CGO_LDFLAGS="-isysroot $SDK_PATH -miphoneos-version-min=14.0"
export CC="$CLANG_PATH" 

# Компилируем проект

go build -o openflux-ios-cli main.go

* name: Upload Native Binary
uses: actions/upload-artifact@v4
with:
name: openflux-ios-binary
path: openflux-ios-cli