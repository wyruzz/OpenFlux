name: Build OpenFlux for iOS Terminal (Binary) 

on:
workflow_dispatch: 

jobs:
build-ios-bin:
runs-on: macos-latest # Обязательно используем macOS-сервер для доступа к iOS SDK 

steps:

* name: Checkout repository
uses: actions/checkout@v4
* name: Set up Go
uses: actions/setup-go@v5
with:
go-version: 'stable'
* name: Install dependencies
run: go mod tidy
* name: Compile Native iOS Binary with CGO
run: |

### Находим официальный путь к iOS SDK в системе

export SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path) 

### Находим путь к компилятору Clang от Apple

export CLANG_PATH=$(xcrun --sdk iphoneos --find clang) 

### Настраиваем окружение Go для сборки под iPhone

export CGO_ENABLED=1
export GOOS=ios
export GOARCH=arm64 

### Передаем правильные флаги компилятору Apple (целевая ОС — iOS версии 14 и выше)

export CGO_CFLAGS="-isysroot $SDK_PATH -miphoneos-version-min=14.0"
export CGO_LDFLAGS="-isysroot $SDK_PATH -miphoneos-version-min=14.0"
export CC="$CLANG_PATH" 

# Запускаем сборку исполняемого файла

go build -o openflux-ios-cli main.go

* name: Upload Native Binary
uses: actions/upload-artifact@v4
with:
name: openflux-ios-binary
path: openflux-ios-cli